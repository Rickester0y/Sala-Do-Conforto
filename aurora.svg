<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fundoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#141a35" />
    </linearGradient>

    <radialGradient id="blobAzul" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a6ea5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3a6ea5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blobRoxo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a4c93" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6a4c93" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blobCiano" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd8d0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4fd8d0" stop-opacity="0" />
    </radialGradient>

    <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#fundoBase)" />

  <g filter="url(#desfoque)">
    <ellipse cx="300" cy="200" rx="420" ry="320" fill="url(#blobAzul)" />
    <ellipse cx="1300" cy="150" rx="380" ry="300" fill="url(#blobRoxo)" />
    <ellipse cx="1150" cy="750" rx="450" ry="340" fill="url(#blobCiano)" />
    <ellipse cx="150" cy="800" rx="350" ry="280" fill="url(#blobRoxo)" />
  </g>
</svg>
