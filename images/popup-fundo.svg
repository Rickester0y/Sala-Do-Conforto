<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sc-blur-grande" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <filter id="sc-blur-medio" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Base: cinza bem escuro (não é preto puro nem repete a cor de nenhum
       tema do site — Alto Contraste #000000, Modo Escuro #1a1a1d, Grafite
       #1e1f24 — é um cinza um pouco mais neutro/frio, exclusivo do popup) -->
  <rect x="0" y="0" width="400" height="600" fill="#242329" />

  <!-- Manchas orgânicas borradas, tons de cinza um degrau mais claros que a
       base, pra dar textura sutil sem virar um "tema" colorido -->
  <ellipse cx="40" cy="80" rx="180" ry="140" fill="#34323b" filter="url(#sc-blur-grande)" />
  <ellipse cx="380" cy="60" rx="150" ry="120" fill="#3c3a44" filter="url(#sc-blur-grande)" />
  <ellipse cx="370" cy="420" rx="200" ry="170" fill="#2e2d34" filter="url(#sc-blur-grande)" />
  <ellipse cx="20" cy="520" rx="160" ry="130" fill="#3a3841" filter="url(#sc-blur-medio)" />
  <ellipse cx="210" cy="300" rx="140" ry="110" fill="#312f37" filter="url(#sc-blur-medio)" opacity="0.7" />
</svg>
