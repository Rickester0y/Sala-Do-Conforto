<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Sala Confortável</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f4f5f7;
      color: #23232a;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, #2c2c30, #1a1a1d);
      color: #fff;
    }

    header .emoji {
      font-size: 26px;
      line-height: 1;
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    header p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #c7c7cf;
    }

    main {
      padding: 14px 16px 16px;
    }

    .secao-titulo {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a8a94;
      margin: 0 0 8px 2px;
    }

    #lista-temas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tema-card {
      position: relative;
      border: 2px solid transparent;
      border-radius: 10px;
      background: #fff;
      padding: 8px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      transition: transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .tema-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .tema-card.selecionado {
      border-color: #4f9dff;
    }

    .tema-card .amostra {
      display: flex;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .tema-card .amostra span {
      flex: 1;
    }

    .tema-card .nome-tema {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #33333c;
      line-height: 1.25;
    }

    .tema-card .check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4f9dff;
      color: #fff;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .tema-card.selecionado .check {
      display: flex;
    }

    details.tema-custom {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    details.tema-custom summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #33333c;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    details.tema-custom summary::-webkit-details-marker {
      display: none;
    }

    details.tema-custom summary .seta {
      transition: transform 0.15s ease;
      color: #9a9aa4;
      font-size: 10px;
    }

    details.tema-custom[open] summary .seta {
      transform: rotate(90deg);
    }

    .cores-corpo {
      padding: 0 12px 12px;
    }

    .cor-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
      color: #55555f;
    }

    .cor-linha input[type="color"] {
      width: 30px;
      height: 22px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 0;
      cursor: pointer;
      background: none;
    }

    .preview-custom {
      height: 24px;
      border-radius: 6px;
      margin: 8px 0 10px;
      overflow: hidden;
      display: flex;
    }

    .preview-custom span {
      flex: 1;
    }

    button#salvar-custom {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 7px;
      background: #23232a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button#salvar-custom:hover {
      background: #000;
    }

    button#salvar-custom.salvo {
      background: #2e9e5b;
    }

    footer {
      padding: 10px 16px 14px;
      text-align: center;
      font-size: 10px;
      color: #a0a0aa;
    }
  </style>
</head>
<body>
  <header>
    <div class="emoji">🎨</div>
    <div>
      <h1>Sala Confortável</h1>
      <p>Personalize a Sala do Futuro</p>
    </div>
  </header>

  <main>
    <p class="secao-titulo">Escolha um tema</p>
    <div id="lista-temas"><!-- Preenchido pelo popup.js --></div>

    <details class="tema-custom" id="detalhes-custom">
      <summary>
        Criar meu próprio tema
        <span class="seta">▶</span>
      </summary>
      <div class="cores-corpo">
        <div class="cor-linha">
          <span>Fundo</span>
          <input type="color" id="cor-bg" value="#1a1a1d" />
        </div>
        <div class="cor-linha">
          <span>Fundo dos cards</span>
          <input type="color" id="cor-bg-secundario" value="#2c2c30" />
        </div>
        <div class="cor-linha">
          <span>Texto</span>
          <input type="color" id="cor-texto" value="#e8e8e8" />
        </div>
        <div class="cor-linha">
          <span>Destaque</span>
          <input type="color" id="cor-destaque" value="#4f9dff" />
        </div>

        <div class="preview-custom" id="preview-custom"></div>

        <button id="salvar-custom">Usar meu tema</button>
      </div>
    </details>
  </main>

  <footer>Feito por um aluno, pra outros alunos 💙</footer>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
